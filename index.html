<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>共同點餐 V1.4</title>
  <style>
    * { box-sizing: border-box; }
    body { margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC",Arial,sans-serif; background:#f4f4f4; color:#171717; }
    header { background:white; padding:20px 18px 16px; border-bottom:1px solid #ddd; position:sticky; top:0; z-index:10; }
    h1 { margin:0; font-size:28px; }
    .status { margin-top:6px; color:#16803c; font-weight:700; }
    .tabs { display:flex; gap:10px; padding:16px; overflow-x:auto; background:#f4f4f4; position:sticky; top:82px; z-index:9; }
    button { border:none; border-radius:18px; padding:13px 18px; font-size:16px; font-weight:800; background:#111; color:white; cursor:pointer; }
    button.secondary { background:#e8e8e8; color:#111; }
    main { padding:0 16px 36px; max-width:860px; margin:auto; }
    .card { background:white; border-radius:26px; padding:22px; margin:14px 0 20px; box-shadow:0 1px 0 rgba(0,0,0,.04); }
    h2 { margin:0 0 14px; font-size:24px; }
    label { display:block; color:#666; margin:12px 0 6px; font-weight:700; }
    input, textarea { width:100%; border:1px solid #d6d6d6; border-radius:18px; padding:14px 16px; font-size:18px; background:white; }
    textarea { min-height:210px; resize:vertical; line-height:1.5; }
    .row { display:flex; gap:10px; align-items:center; }
    .row > * { flex:1; }
    .small { color:#666; font-size:14px; line-height:1.5; }
    .store, .menu-item, .order { border:1px solid #eee; background:#fafafa; border-radius:18px; padding:14px; margin:10px 0; }
    .store.active { border:2px solid #111; background:#fff; }
    .item-line { display:flex; justify-content:space-between; gap:12px; align-items:center; }
    .price { font-weight:900; font-size:20px; white-space:nowrap; }
    .pill { display:inline-block; padding:5px 10px; border-radius:999px; background:#eee; color:#333; font-size:13px; margin-top:6px; }
    .danger { background:#ffecec !important; color:#a00 !important; }
    .hide { display:none; }
    .total { background:#111; color:white; border-radius:22px; padding:18px; font-size:28px; font-weight:900; margin-top:12px; }
    .copybox { background:#f1f1f1; padding:14px; border-radius:16px; word-break:break-all; font-size:15px; }
    .qty { display:flex; gap:8px; align-items:center; justify-content:flex-end; }
    .qty button { padding:8px 12px; border-radius:12px; min-width:42px; }
    .grid2 { display:grid; grid-template-columns:1fr; gap:12px; }
    @media (min-width:720px) { .grid2 { grid-template-columns:1fr 1fr; } }
  </style>
</head>
<body>
<header>
  <h1>共同點餐 V1.4</h1>
  <div id="status" class="status">Firebase 連線中...</div>
</header>

<nav class="tabs">
  <button onclick="showPage('stores')">店家</button>
  <button onclick="showPage('room')">房間</button>
  <button onclick="showPage('order')">點餐</button>
  <button onclick="showPage('summary')">總覽</button>
</nav>

<main>
  <section id="storesPage">
    <div class="card">
      <h2>選擇店家</h2>
      <p class="small">店家會儲存在 Firebase。不同手機開同一個網址都能讀到。</p>
      <div id="storeList">讀取中...</div>
    </div>

    <div class="card">
      <h2>新增或更新店家</h2>
      <label>店名</label>
      <input id="storeName" placeholder="例如：利威特小館" />
      <label>電話</label>
      <input id="storePhone" placeholder="例如：(07)374-5641" />
      <label>貼上菜單文字</label>
      <textarea id="menuText" placeholder="格式範例：
利威特小館
訂購專線：(07)374-5641
陽春麵 55 45
刀削麵 55 45
肉燥飯 40 30
蛋炒飯 60"></textarea>
      <div class="row">
        <button onclick="loadSample()" class="secondary">帶入範例</button>
        <button onclick="parsePreview()">解析預覽</button>
      </div>
      <div id="previewBox" class="small"></div>
      <button onclick="saveStore()" style="margin-top:14px;">儲存店家</button>
    </div>
  </section>

  <section id="roomPage" class="hide">
    <div class="card">
      <h2>目前店家</h2>
      <div id="selectedStoreInfo" class="small">尚未選擇店家</div>
    </div>
    <div class="card">
      <h2>建立房間</h2>
      <label>你的名字</label>
      <input id="userName" placeholder="例如：Frank" />
      <label>房間名稱</label>
      <input id="roomName" value="共同點餐" />
      <button onclick="createRoom()">建立新房間</button>
    </div>
    <div class="card">
      <h2>加入房間</h2>
      <label>房間 ID</label>
      <input id="joinRoomId" placeholder="貼上朋友給你的房間 ID" />
      <button onclick="joinRoom()">加入房間</button>
    </div>
    <div class="card">
      <h2>目前房間</h2>
      <div id="roomInfo" class="small">尚未加入房間</div>
      <div id="roomShare" class="copybox hide"></div>
      <button onclick="copyRoomLink()" class="secondary" style="margin-top:10px;">複製分享連結</button>
    </div>
  </section>

  <section id="orderPage" class="hide">
    <div class="card">
      <h2>點餐</h2>
      <div id="orderContext" class="small">請先選店家並建立/加入房間</div>
      <label>你的名字</label>
      <input id="orderUserName" placeholder="例如：Frank" oninput="syncUserName(this.value)" />
      <label>備註</label>
      <input id="orderNote" placeholder="例如：小辣、不加蔥" />
      <div id="menuList"></div>
    </div>
  </section>

  <section id="summaryPage" class="hide">
    <div class="card">
      <h2>目前訂單</h2>
      <div id="liveOrders"></div>
      <div id="totalBox" class="total">總金額：$0</div>
    </div>
    <div class="grid2">
      <div class="card">
        <h2>依人彙整</h2>
        <div id="byPerson"></div>
      </div>
      <div class="card">
        <h2>依餐點彙整</h2>
        <div id="byItem"></div>
      </div>
    </div>
  </section>
</main>

<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyAVqIRaIwIxocyXXnkNWSrxj62cZi5-RiM",
  authDomain: "order-test-cd39a.firebaseapp.com",
  projectId: "order-test-cd39a",
  storageBucket: "order-test-cd39a.firebasestorage.app",
  messagingSenderId: "954276356824",
  appId: "1:954276356824:web:4d3044f498f0001fae6dad"
};

firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.firestore();

let stores = [];
let selectedStore = null;
let currentRoomId = "";
let unsubscribeOrders = null;
let orders = [];

auth.signInAnonymously()
  .then(() => {
    document.getElementById("status").innerText = "Firebase 已連線";
    loadStores();
    readUrlRoom();
  })
  .catch(err => {
    document.getElementById("status").innerText = "Firebase 連線失敗：" + err.message;
  });

function showPage(page) {
  ["stores","room","order","summary"].forEach(p => document.getElementById(p + "Page").classList.add("hide"));
  document.getElementById(page + "Page").classList.remove("hide");
}

function loadSample() {
  document.getElementById("storeName").value = "利威特小館";
  document.getElementById("storePhone").value = "(07)374-5641";
  document.getElementById("menuText").value =
`利威特小館
訂購專線：(07)374-5641
陽春麵 55 45
刀削麵 55 45
麻醬乾麵 60 50
肉燥飯 40 30
蛋炒飯 60
香腸炒飯 75
腿庫飯 95 90
油豆腐 10
皮蛋 15
燙青菜 35`;
}

function normalizePriceText(text) {
  return text.replace(/元/g, "").replace(/＄/g, "$").replace(/\s+/g, " ").trim();
}

function extractPhone(text) {
  const m = text.match(/(\(?0\d{1,2}\)?[-\s]?\d{3,4}[-\s]?\d{3,4}|09\d{2}[-\s]?\d{3}[-\s]?\d{3})/);
  return m ? m[1].replace(/\s/g, "") : "";
}

function parseMenu(text) {
  const lines = text.split(/\n/).map(x => x.trim()).filter(Boolean);
  const phone = extractPhone(text);
  let storeName = document.getElementById("storeName").value.trim() || "";
  if (!storeName && lines.length) storeName = lines[0];

  const items = [];
  const ignoreWords = /(訂購|專線|電話|地址|內用|外帶|總計|數量|桌號|菜單|小菜類|湯類|麵類|飯類)/;

  for (const raw of lines) {
    let line = normalizePriceText(raw);
    if (!line || ignoreWords.test(line)) continue;

    const nums = [...line.matchAll(/\d{1,4}/g)].map(m => ({ value: Number(m[0]), index: m.index }));
    if (nums.length === 0) continue;

    const possiblePrices = nums.filter(n => n.value >= 5 && n.value <= 999);
    if (possiblePrices.length === 0) continue;

    const firstPriceIndex = possiblePrices[0].index;
    let name = line.slice(0, firstPriceIndex).replace(/[\$：:]/g, "").trim();
    if (!name || name.length < 2) continue;

    const prices = possiblePrices.map(n => n.value);
    if (prices.length >= 2) {
      items.push({ name: name + " 大", price: prices[0] });
      items.push({ name: name + " 小", price: prices[1] });
    } else {
      items.push({ name, price: prices[0] });
    }
  }

  const unique = [];
  const seen = new Set();
  for (const item of items) {
    const key = item.name + "-" + item.price;
    if (!seen.has(key)) {
      seen.add(key);
      unique.push(item);
    }
  }
  return { storeName, phone, items: unique };
}

function parsePreview() {
  const text = document.getElementById("menuText").value;
  const result = parseMenu(text);
  if (result.phone && !document.getElementById("storePhone").value.trim()) {
    document.getElementById("storePhone").value = result.phone;
  }
  document.getElementById("previewBox").innerHTML =
    `<p>店名：${escapeHtml(result.storeName || "未辨識")}</p>
     <p>電話：${escapeHtml(result.phone || document.getElementById("storePhone").value || "未辨識")}</p>
     <p>品項數：${result.items.length}</p>
     <div>${result.items.slice(0, 20).map(i => `<div>${escapeHtml(i.name)} - $${i.price}</div>`).join("")}</div>`;
  return result;
}

async function saveStore() {
  const result = parsePreview();
  const name = document.getElementById("storeName").value.trim() || result.storeName;
  const phone = document.getElementById("storePhone").value.trim() || result.phone;
  if (!name) return alert("請輸入店名");
  if (!result.items.length) return alert("沒有解析到菜單品項");

  const store = {
    name,
    phone,
    menu: result.items,
    rawText: document.getElementById("menuText").value,
    updatedAt: firebase.firestore.FieldValue.serverTimestamp()
  };

  const existing = stores.find(s => s.name === name);
  if (existing) {
    await db.collection("stores").doc(existing.id).set(store, { merge: true });
  } else {
    await db.collection("stores").add({ ...store, createdAt: firebase.firestore.FieldValue.serverTimestamp() });
  }
  alert("店家已儲存");
}

function loadStores() {
  db.collection("stores").orderBy("updatedAt", "desc").onSnapshot(snapshot => {
    stores = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
    renderStores();
  }, err => {
    document.getElementById("storeList").innerText = "讀取店家失敗：" + err.message;
  });
}

function renderStores() {
  const box = document.getElementById("storeList");
  if (!stores.length) {
    box.innerHTML = "<p class='small'>尚無店家，請先新增。</p>";
    return;
  }
  box.innerHTML = stores.map(store => `
    <div class="store ${selectedStore && selectedStore.id === store.id ? "active" : ""}">
      <div class="item-line">
        <div>
          <strong>${escapeHtml(store.name)}</strong>
          <div class="small">${escapeHtml(store.phone || "無電話")}</div>
          <span class="pill">${(store.menu || []).length} 個品項</span>
        </div>
        <button onclick="selectStore('${store.id}')">選擇</button>
      </div>
    </div>
  `).join("");
}

function selectStore(id) {
  selectedStore = stores.find(s => s.id === id);
  renderStores();
  renderSelectedStore();
  renderMenu();
  showPage("room");
}

function renderSelectedStore() {
  const text = selectedStore
    ? `<strong>${escapeHtml(selectedStore.name)}</strong><br>電話：${escapeHtml(selectedStore.phone || "無")}<br>品項：${(selectedStore.menu || []).length}`
    : "尚未選擇店家";
  document.getElementById("selectedStoreInfo").innerHTML = text;
  document.getElementById("orderContext").innerHTML = selectedStore
    ? `店家：<strong>${escapeHtml(selectedStore.name)}</strong> ｜ 電話：${escapeHtml(selectedStore.phone || "無")}<br>房間：${currentRoomId || "尚未加入"}`
    : "請先選店家並建立/加入房間";
}

async function createRoom() {
  if (!selectedStore) return alert("請先選擇店家");
  const user = document.getElementById("userName").value.trim() || "匿名";
  syncUserName(user);
  const doc = await db.collection("rooms").add({
    roomName: document.getElementById("roomName").value.trim() || "共同點餐",
    storeId: selectedStore.id,
    storeName: selectedStore.name,
    storePhone: selectedStore.phone || "",
    menu: selectedStore.menu || [],
    createdAt: firebase.firestore.FieldValue.serverTimestamp()
  });
  currentRoomId = doc.id;
  document.getElementById("joinRoomId").value = currentRoomId;
  listenRoom(currentRoomId);
  updateRoomUi();
  showPage("order");
}

async function joinRoom() {
  const id = document.getElementById("joinRoomId").value.trim();
  if (!id) return alert("請輸入房間 ID");
  const doc = await db.collection("rooms").doc(id).get();
  if (!doc.exists) return alert("找不到房間");
  const data = doc.data();
  currentRoomId = id;
  selectedStore = { id: data.storeId || "", name: data.storeName || "未知店家", phone: data.storePhone || "", menu: data.menu || [] };
  listenRoom(currentRoomId);
  updateRoomUi();
  renderSelectedStore();
  renderMenu();
  showPage("order");
}

function listenRoom(roomId) {
  if (unsubscribeOrders) unsubscribeOrders();
  unsubscribeOrders = db.collection("rooms").doc(roomId).collection("orders")
    .orderBy("createdAt", "asc")
    .onSnapshot(snapshot => {
      orders = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
      renderOrders();
      renderSummary();
    });
}

function updateRoomUi() {
  document.getElementById("roomInfo").innerHTML =
    currentRoomId
      ? `房間 ID：<strong>${currentRoomId}</strong><br>店家：${escapeHtml(selectedStore?.name || "")}<br>電話：${escapeHtml(selectedStore?.phone || "無")}`
      : "尚未加入房間";
  const link = location.origin + location.pathname + "?room=" + encodeURIComponent(currentRoomId);
  const box = document.getElementById("roomShare");
  if (currentRoomId) {
    box.classList.remove("hide");
    box.innerText = link;
  }
}

function copyRoomLink() {
  if (!currentRoomId) return alert("尚未建立房間");
  const link = location.origin + location.pathname + "?room=" + encodeURIComponent(currentRoomId);
  navigator.clipboard.writeText(link).then(() => alert("已複製分享連結"));
}

function readUrlRoom() {
  const params = new URLSearchParams(location.search);
  const room = params.get("room");
  if (room) {
    document.getElementById("joinRoomId").value = room;
    setTimeout(joinRoom, 500);
  }
}

function syncUserName(value) {
  document.getElementById("userName").value = value;
  document.getElementById("orderUserName").value = value;
}

function renderMenu() {
  const box = document.getElementById("menuList");
  if (!selectedStore || !selectedStore.menu || !selectedStore.menu.length) {
    box.innerHTML = "<p class='small'>尚無菜單</p>";
    return;
  }
  box.innerHTML = selectedStore.menu.map((item, index) => `
    <div class="menu-item">
      <div class="item-line">
        <div>
          <strong>${escapeHtml(item.name)}</strong>
          <div class="price">$${item.price}</div>
        </div>
        <button onclick="addOrder(${index})">加入</button>
      </div>
    </div>
  `).join("");
  renderSelectedStore();
}

async function addOrder(index) {
  if (!currentRoomId) return alert("請先建立或加入房間");
  const item = selectedStore.menu[index];
  const user = document.getElementById("orderUserName").value.trim() || document.getElementById("userName").value.trim() || "匿名";
  const note = document.getElementById("orderNote").value.trim();
  await db.collection("rooms").doc(currentRoomId).collection("orders").add({
    user,
    itemName: item.name,
    price: Number(item.price || 0),
    qty: 1,
    note,
    createdAt: firebase.firestore.FieldValue.serverTimestamp()
  });
}

async function changeQty(orderId, qty) {
  if (qty <= 0) {
    await db.collection("rooms").doc(currentRoomId).collection("orders").doc(orderId).delete();
  } else {
    await db.collection("rooms").doc(currentRoomId).collection("orders").doc(orderId).update({ qty });
  }
}

async function deleteOrder(orderId) {
  await db.collection("rooms").doc(currentRoomId).collection("orders").doc(orderId).delete();
}

function renderOrders() {
  const box = document.getElementById("liveOrders");
  if (!orders.length) {
    box.innerHTML = "<p class='small'>尚未點餐</p>";
    return;
  }
  box.innerHTML = orders.map(o => `
    <div class="order">
      <div class="item-line">
        <div>
          <strong>${escapeHtml(o.user || "匿名")}｜${escapeHtml(o.itemName)}</strong>
          <div class="small">${escapeHtml(o.note || "無備註")}</div>
          <div class="price">$${Number(o.price || 0) * Number(o.qty || 1)}</div>
        </div>
        <div class="qty">
          <button onclick="changeQty('${o.id}', ${Number(o.qty || 1) - 1})">-</button>
          <strong>${o.qty || 1}</strong>
          <button onclick="changeQty('${o.id}', ${Number(o.qty || 1) + 1})">+</button>
        </div>
      </div>
      <button class="secondary danger" onclick="deleteOrder('${o.id}')" style="margin-top:8px;">刪除</button>
    </div>
  `).join("");
}

function renderSummary() {
  let total = 0;
  const byPerson = {};
  const byItem = {};
  for (const o of orders) {
    const amount = Number(o.price || 0) * Number(o.qty || 1);
    total += amount;
    const user = o.user || "匿名";
    if (!byPerson[user]) byPerson[user] = [];
    byPerson[user].push(o);
    const name = o.itemName;
    if (!byItem[name]) byItem[name] = { qty: 0, total: 0 };
    byItem[name].qty += Number(o.qty || 1);
    byItem[name].total += amount;
  }
  document.getElementById("totalBox").innerText = "總金額：$" + total;
  document.getElementById("byPerson").innerHTML = Object.entries(byPerson).map(([user, list]) => {
    const subtotal = list.reduce((s,o) => s + Number(o.price || 0) * Number(o.qty || 1), 0);
    return `<div class="order">
      <strong>${escapeHtml(user)}</strong>
      ${list.map(o => `<div class="item-line small"><span>${escapeHtml(o.itemName)} x${o.qty || 1}</span><span>$${Number(o.price || 0) * Number(o.qty || 1)}</span></div>`).join("")}
      <hr><div class="item-line"><strong>小計</strong><strong>$${subtotal}</strong></div>
    </div>`;
  }).join("") || "<p class='small'>尚無資料</p>";
  document.getElementById("byItem").innerHTML = Object.entries(byItem).map(([name, data]) => `
    <div class="order item-line">
      <span>${escapeHtml(name)} x${data.qty}</span>
      <strong>$${data.total}</strong>
    </div>
  `).join("") || "<p class='small'>尚無資料</p>";
}

function escapeHtml(str) {
  return String(str ?? "").replace(/[&<>"']/g, s => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#039;" }[s]));
}
</script>
</body>
</html>
